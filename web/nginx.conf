server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API sits behind the same origin, so the browser makes no
    # cross-origin requests and the app needs no CORS configuration.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The rate limiter keys on client IP, so the real one has to survive
        # the hop. Without this every shopper would look like the proxy.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed asset filenames, so they can be held indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
